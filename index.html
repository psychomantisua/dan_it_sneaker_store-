<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stride — магазин кросівок</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FAF9F6;--card:#fff;--soft:#EFEEE9;--tile:#F2F0EB;--tx:#111;--tx2:#6F6F6A;--tx3:#A3A29C;--line:#E6E4DE;--olive:#6B7A55;--olive-d:#4F5B3E}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:"DM Sans",system-ui,sans-serif;line-height:1.4}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.02em}
.bar nav{display:flex;gap:20px;margin-left:24px;font-size:14px;font-weight:500;color:var(--tx2)}
.bar nav a{color:inherit;text-decoration:none}.bar nav a:hover{color:var(--olive)}
.sp{flex:1}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;background:#fff}
.ic svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-2px;right:-2px;background:#111;color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.hero{margin-top:20px;background:var(--soft);border-radius:28px;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;overflow:hidden}
.hero .t{padding:48px 40px}
h1{font-size:clamp(34px,5vw,60px);font-weight:700;line-height:1.05;letter-spacing:-.02em}
.hero p{font-size:20px;font-weight:300;color:var(--tx2);margin:16px 0 28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 28px;font-size:14px;font-weight:600;background:#111;color:#fff;text-decoration:none}
.btn:hover{background:#2a2a2a}.btn.w{background:#fff;color:#111}.btn.w:hover{background:#f6f5f1}
.hero .img{padding:24px}.hero svg{width:100%;height:auto;display:block;transform:rotate(-6deg)}
.trust{display:flex;gap:12px 32px;flex-wrap:wrap;margin:24px 0 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:13px;color:var(--tx2)}
.trust b{color:var(--tx);font-weight:600}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:40px 0 16px}
h2{font-size:24px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.card .im{background:var(--tile);aspect-ratio:5/4;display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.card .im svg{width:100%;transition:transform .2s}.card:hover .im svg{transform:scale(1.04)}
.tag{position:absolute;left:12px;top:12px;background:var(--olive);color:#fff;font-size:11px;padding:3px 10px;border-radius:999px}
.heart{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center}
.heart svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:1.5}.heart.on svg{fill:#111}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.n{display:flex;justify-content:space-between;font-size:14px;font-weight:500}.n span{font-weight:600}
.d{font-size:13px;color:var(--tx2);flex:1}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}
select{border:1px solid var(--line);border-radius:999px;padding:9px 12px;background:#fff;font-size:13px}
.add{flex:1;background:#111;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:600}.add:hover{background:#2a2a2a}
footer{margin:56px 0 32px;color:var(--tx3);font-size:13px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(17,17,17,.35);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.ov.o{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dr.o{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 12px}
.db{flex:1;overflow:auto;padding:0 20px 16px;display:flex;flex-direction:column;gap:10px}
.df{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#fff}
.li{display:flex;gap:12px;background:#fff;border-radius:16px;padding:10px;align-items:center}
.li .th{width:84px;background:var(--tile);border-radius:12px;padding:6px;flex:none}
.li .th svg{width:100%;display:block}
.li .m{flex:1;font-size:14px}.li .m small{color:var(--tx2);display:block}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;margin-top:6px}
.qty button{width:30px;height:30px;font-size:16px}.qty i{min-width:20px;text-align:center;font-style:normal;font-size:13px}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--tx2);margin-bottom:6px}.sum.t{color:var(--tx);font-weight:600;font-size:16px;margin-bottom:14px}
.full{width:100%}
.f{display:flex;flex-direction:column;gap:10px}
.f label{font-size:12px;color:var(--tx2);display:flex;flex-direction:column;gap:4px}
.f input,.f select{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font-size:14px;width:100%}
.opt{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;flex-direction:row!important;color:var(--tx)!important}
.opt input{width:auto}
.empty{text-align:center;color:var(--tx2);padding:40px 0;font-size:14px}
.done{text-align:center;padding:48px 8px}.done h2{margin:16px 0 8px}.done p{color:var(--tx2);font-size:14px}
.ok{width:64px;height:64px;border-radius:50%;background:var(--olive);margin:0 auto;display:grid;place-items:center}.ok svg{width:30px;stroke:#fff;fill:none;stroke-width:2}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .t{padding:32px 24px 0}.bar nav{display:none}.wrap{padding:0 16px}}
</style></head><body>
<header><div class="wrap bar"><div class="logo">Stride</div>
<nav><a href="#catalog">Каталог</a><a href="#about">Доставка</a></nav><div class="sp"></div>
<button class="ic" id="cartBtn" aria-label="Кошик"><svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg><span class="badge" id="cnt">0</span></button></div></header>
<main class="wrap">
<section class="hero"><div class="t"><h1>Кроки щодня.<br>Легко.<br>Зручно.</h1><p>Практичні кросівки. Справжній комфорт. Для кожної частини дня.</p>
<div class="btns"><a class="btn" href="#catalog">Купити зараз</a><a class="btn w" href="#catalog">Новинки</a></div></div><div class="img" id="heroImg"></div></section>
<div class="trust" id="about"><span><b>Безкоштовна доставка</b> від $100</span><span><b>Легке повернення</b> 30 днів</span><span><b>Безпечна оплата</b></span><span><b>Нова пошта</b> та Укрпошта</span></div>
<div class="sh" id="catalog"><h2>Новинки</h2><span style="font-size:13px;font-weight:500">6 моделей</span></div>
<div class="grid" id="grid"></div>
<footer>© Stride. Кросівки для щоденного життя.</footer>
</main>
<div class="ov" id="ov"></div>
<aside class="dr" id="dr" aria-label="Кошик"><div class="dh"><h2 id="dt">Кошик</h2><button class="ic" id="close" aria-label="Закрити"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="db" id="db"></div><div class="df" id="df"></div></aside>
<script>
var P=[
{id:1,n:"Cloud Runner",p:89.99,d:"Легка піна та дихаюча сітка для щоденних пробіжок.",u:"#F4F4F2",a:"#6B7A55",s:"#E4D8C3",tag:"Хіт"},
{id:2,n:"Urban Low",p:74.99,d:"Мінімалістичний чорний силует на кожен день.",u:"#1c1c1c",a:"#BDBDB8",s:"#F4F4F2"},
{id:3,n:"Trail Olive",p:109.99,d:"Міцна підошва та водовідштовхувальний верх для міста й парку.",u:"#6B7A55",a:"#E4D8C3",s:"#2b2b2b",tag:"Нове"},
{id:4,n:"Sand Classic",p:64.99,d:"Класична шкіра пісочного кольору з м'якою устілкою.",u:"#E4D8C3",a:"#B9A88A",s:"#F4F4F2"},
{id:5,n:"Denim Court",p:79.99,d:"Текстильний верх кольору денім у стилі кортів.",u:"#3E5F85",a:"#F4F4F2",s:"#F4F4F2"},
{id:6,n:"Daily Knit",p:69.99,d:"Еластичний трикотаж, що сидить як шкарпетка.",u:"#BDBDB8",a:"#111",s:"#F4F4F2"}];
function shoe(q){return '<svg viewBox="0 0 200 120" role="img" aria-label="'+q.n+'"><path d="M14 84C14 70 30 68 44 60L60 38c4-4 10-4 14 0l12 14c10 6 34 8 64 14 24 5 38 10 38 22v6H14z" fill="'+q.u+'" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/><path d="M72 66c20-8 52-2 72 14" fill="none" stroke="'+q.a+'" stroke-width="7" stroke-linecap="round"/><path d="M66 50l10 6M74 44l10 8M82 40l10 10" stroke="#111" stroke-width="1.5" stroke-linecap="round" opacity=".6"/><path d="M10 92h182v10c0 4-4 7-8 7H18c-5 0-8-3-8-7z" fill="'+q.s+'" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>'}
function $(i){return document.getElementById(i)}
function m(x){return "$"+x.toFixed(2)}
var WEBHOOK="https://danit-n8n.duckdns.org/webhook-test/bc0d94bc-98b1-486a-8646-2cfc0ccc46a8";
var C=[],mode="cart";
$("heroImg").innerHTML=shoe(P[0]);
$("grid").innerHTML=P.map(function(q){return '<article class="card"><div class="im">'+(q.tag?'<span class="tag">'+q.tag+'</span>':'')+'<button class="heart" aria-label="В обране"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>'+shoe(q)+'</div><div class="b"><div class="n">'+q.n+'<span>'+m(q.p)+'</span></div><div class="d">'+q.d+'</div><div class="row"><select id="sz'+q.id+'" aria-label="Розмір">'+[38,39,40,41,42,43,44,45].map(function(s){return '<option'+(s==42?' selected':'')+'>'+s+'</option>'}).join('')+'</select><button class="add" data-id="'+q.id+'">В кошик</button></div></div></article>'}).join('');
document.querySelectorAll(".heart").forEach(function(h){h.onclick=function(){h.classList.toggle("on")}});
document.querySelectorAll(".add").forEach(function(b){b.onclick=function(){var id=+b.dataset.id,sz=$("sz"+id).value,e=C.find(function(c){return c.id==id&&c.sz==sz});e?e.q++:C.push({id:id,sz:sz,q:1});mode="cart";draw();open(true)}});
function open(o){$("dr").classList.toggle("o",o);$("ov").classList.toggle("o",o)}
$("cartBtn").onclick=function(){mode="cart";draw();open(true)};$("close").onclick=$("ov").onclick=function(){open(false)};
function sub(){return C.reduce(function(s,c){return s+P[c.id-1].p*c.q},0)}
function ship(){return sub()>=100||!C.length?0:4.99}
function draw(){
$("cnt").textContent=C.reduce(function(s,c){return s+c.q},0);
var db=$("db"),df=$("df");
if(mode=="done")return;
if(mode=="cart"){$("dt").textContent="Кошик";
db.innerHTML=C.length?C.map(function(c,i){var q=P[c.id-1];return '<div class="li"><div class="th">'+shoe(q)+'</div><div class="m"><b>'+q.n+'</b><small>Розмір '+c.sz+' · '+m(q.p)+'</small><div class="qty"><button data-i="'+i+'" data-d="-1" aria-label="Менше">−</button><i>'+c.q+'</i><button data-i="'+i+'" data-d="1" aria-label="Більше">+</button></div></div><b>'+m(q.p*c.q)+'</b></div>'}).join(''):'<div class="empty">Кошик порожній. Додайте кросівки з каталогу.</div>';
df.innerHTML=C.length?'<div class="sum"><span>Товари</span><span>'+m(sub())+'</span></div><div class="sum"><span>Доставка</span><span>'+(ship()?m(ship()):"Безкоштовно")+'</span></div><div class="sum t"><span>Разом</span><span>'+m(sub()+ship())+'</span></div><button class="btn full" id="go">Оформити замовлення</button>':'';
db.querySelectorAll(".qty button").forEach(function(b){b.onclick=function(){var c=C[+b.dataset.i];c.q+=+b.dataset.d;if(c.q<1)C.splice(+b.dataset.i,1);draw()}});
if(C.length)$("go").onclick=function(){mode="co";draw()}}
else{$("dt").textContent="Оформлення";
db.innerHTML='<div class="f"><label>Ім\'я та прізвище<input id="fn" autocomplete="name"></label><label>Телефон<input id="fp" type="tel" placeholder="+380" autocomplete="tel"></label><label>Місто<input id="fc" autocomplete="address-level2"></label><label>Відділення або адреса<input id="fa"></label><label>Доставка<select id="fd"><option>Нова пошта</option><option>Укрпошта</option><option>Кур\'єр</option></select></label><label class="opt"><input type="radio" name="pay" checked> Оплата карткою онлайн</label><label class="opt"><input type="radio" name="pay"> Оплата при отриманні</label><div id="er" style="color:#a33;font-size:13px"></div></div>';
df.innerHTML='<div class="sum t"><span>До сплати</span><span>'+m(sub()+ship())+'</span></div><button class="btn full" id="pay">Підтвердити замовлення</button><button class="btn w full" id="bk" style="margin-top:8px">Назад до кошика</button>';
$("bk").onclick=function(){mode="cart";draw()};
$("pay").onclick=async function(){var ok=["fn","fp","fc","fa"].every(function(i){return $(i).value.trim()});if(!ok){$("er").textContent="Заповніть усі поля.";return}
var no="ST-"+Math.floor(10000+Math.random()*90000),t=sub()+ship();
var pl={orderId:no,createdAt:new Date().toISOString(),customer:{name:$("fn").value.trim(),phone:$("fp").value.trim(),city:$("fc").value.trim(),address:$("fa").value.trim()},delivery:$("fd").value,payment:document.querySelector("input[name=pay]:checked").parentNode.textContent.trim(),items:C.map(function(c){var q=P[c.id-1];return{id:q.id,name:q.n,size:c.sz,quantity:c.q,price:q.p,lineTotal:+(q.p*c.q).toFixed(2)}}),subtotal:+sub().toFixed(2),shipping:ship(),total:+t.toFixed(2),currency:"USD"};
$("pay").disabled=true;$("er").textContent="";
try{var r=await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(pl)});if(!r.ok)throw 0}catch(e){$("pay").disabled=false;$("er").textContent="Не вдалося надіслати замовлення. Спробуйте ще раз.";return}
C=[];mode="done";$("cnt").textContent=0;$("dt").textContent="Готово";
db.innerHTML='<div class="done"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><h2>Дякуємо за замовлення!</h2><p>Номер замовлення '+no+'. Сума '+m(t)+'. Ми зв\'яжемося з вами за номером '+$("fp").value.replace(/</g,"")+' для підтвердження.</p></div>';
df.innerHTML='<button class="btn full" id="fin">Продовжити покупки</button>';$("fin").onclick=function(){mode="cart";draw();open(false)}}}}
draw();
</script></body></html>
